# GPU proving for midnight-proofs, outside midnight-zk.
#
# Both crates implement the `Accelerator` trait of midnight-proofs (feature
# `accel`). Until the hook layer is released, midnight-proofs and
# midnight-curves come from the hooks PR (midnightntwrk/midnight-zk#696),
# pinned to a commit.

[workspace]
resolver = "2"
members = ["accel-metal", "seungheon-adapter"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
midnight-proofs = { version = "0.9.0-rc.2", features = ["accel"] }
midnight-curves = "0.4.0-rc.2"
# SeungHeon Oh's Metal backend (SeungheonOh/midnight-zk, `metal/`), used
# unchanged.
midnight-metal = { git = "https://github.com/SeungheonOh/midnight-zk", rev = "1b95798652120591eccb302d04e67d36593c0bbf" }

# One copy of each, so `Fq` is one type across the hooks and both backends.
[patch.crates-io]
midnight-proofs = { git = "https://github.com/midnightntwrk/midnight-zk", rev = "41a67f061819d5c0d3e4a824914f465936e3c257" }
midnight-curves = { git = "https://github.com/midnightntwrk/midnight-zk", rev = "41a67f061819d5c0d3e4a824914f465936e3c257" }

[patch."https://github.com/SeungheonOh/midnight-zk"]
midnight-curves = { git = "https://github.com/midnightntwrk/midnight-zk", rev = "41a67f061819d5c0d3e4a824914f465936e3c257" }

[profile.release]
debug = 1
