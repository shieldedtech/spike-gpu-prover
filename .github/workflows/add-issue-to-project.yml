name: Add new issues to SRE board

on:
  issues:
    types: [opened]

permissions:
  issues: read

jobs:
  add-to-project:
    name: Add issue to Shielded SRE Board (Backlog)
    uses: shieldedtech/workflows/.github/workflows/add-issue-to-project.yml@b7aa239ad2d4c03da824642f173b1e0e9f4326a5
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    with:
      project_number: 50
      project_owner: shieldedtech
