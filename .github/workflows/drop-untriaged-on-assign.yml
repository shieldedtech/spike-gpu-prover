name: Drop status:untriaged once an issue is assigned

on:
  issues:
    types: [assigned, labeled]

permissions:
  issues: write

concurrency:
  group: drop-untriaged-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  drop-untriaged:
    name: Remove status:untriaged from assigned issues
    uses: shieldedtech/workflows/.github/workflows/drop-untriaged-on-assign.yml@b7aa239ad2d4c03da824642f173b1e0e9f4326a5
