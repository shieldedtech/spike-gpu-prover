name: Apply priority from form

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-priority-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Set native Priority from form dropdown
    uses: shieldedtech/workflows/.github/workflows/apply-priority-from-form.yml@b7aa239ad2d4c03da824642f173b1e0e9f4326a5
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
