name: Nudge PRs without a linked issue

# Dispatcher — calls the reusable workflow in `shieldedtech/workflows`.
# On PR open / ready-for-review, if the PR closes no issue, comments once asking
# for a `Closes #N` link. Never blocks; skips drafts, bot authors, and a
# `no-issue` opt-out label. Implementation:
# https://github.com/shieldedtech/workflows/blob/main/.github/workflows/nudge-pr-without-issue-link.yml

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: nudge-pr-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nudge:
    name: Nudge PR to link a closing issue
    uses: shieldedtech/workflows/.github/workflows/nudge-pr-without-issue-link.yml@b7aa239ad2d4c03da824642f173b1e0e9f4326a5
