[package]
name = "midnight-accel-metal"
version = "0.0.0"
description = "Apple Metal backend for the midnight-proofs accelerator hooks (experimental)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
midnight-proofs.workspace = true
midnight-curves.workspace = true
ff = "0.13"
group = "0.13"
metal = "0.33.0"
objc = "0.2"
rayon = "1.10"
blake2b_simd = "1"
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
default = ["chain"]
# The #667 chain circuit, for the tests and examples.
chain = []

[lints.rust]
# objc's msg_send! expands a cfg on feature "cargo-clippy".
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
